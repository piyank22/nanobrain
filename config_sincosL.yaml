name: t5-s73
notes: "t5 + 3D sin-cos position embeddings that stay learnable (model_kwargs.pos_embed_init=sincos, encoder and decoder): sincos values replace the random init of the learned separable tables. Pairs with sincos-s0 (frozen) to separate the effect of the starting values from freezing. Everything else identical to the t5 reproduction (anishdulal t5-s73 config, seed 0)."
output_dir: output
train_filelist: src/nanobrain/config/fomo300k_images_qc.txt
anneal_filelist: null
num_workers: 16
prefetch_factor: 4
prep_threads: 3
prep_lean: false
clip_quantiles:
- 0.005
- 0.995
grid_size:
- 192
- 240
- 192
target_spacing: 1.0
patch_size: 8
native: true
num_visible: 512
num_predict: 768
num_samples: 2
model_kwargs:
  pos_embed_init: sincos
  depth: 12
  embed_dim: 768
  num_heads: 12
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  drop_path_rate: 0.0
  min_mask_frac: 0.05
  level_weight: 0.5
  rtd_weight: 0.0
  rtd_ratio: 0.15
  rtd_quantiles: 32
  unified_weight: 0.4
  unified_ratio: 0.25
  tumor_prob: 0.5
  lesion_mask_weight: 0.5
  corrupt_extended: true
  gdist_weight: 0.1
  gdist_pairs: subject
  fuse_layers:
  - 4
  - 8
batch_size: 32
accum_iter: 1
base_lr: 0.002
lr: null
min_lr: 1.0e-06
time_limit: 59.5
total_steps: 22500
warmup_steps: 6750
decay_steps: 0
epochs: 3.5
warmup_epochs: 0.3
decay_epochs: 0.7
time_schedule: true
time_decay_frac: 0.2
weight_decay: 0.05
betas:
- 0.9
- 0.95
clip_grad: 1.0
fused_adamw: true
optimizer: muon
muon_lr_mult: 2
muon_momentum: 0.95
muon_encoder_only: false
muon_decoder_only: false
muon_all_matrices: false
muon_fused: true
amp: true
amp_dtype: bfloat16
compile: true
gc_freeze: true
cudagraphs: false
fast_startup: true
high_priority_stream: true
decoder_prune_last: true
flash_attention_impl: FA3
ckpt: null
resume: false
auto_resume: true
checkpoint_period: 100000000
checkpoint_steps: null
print_freq: 100
plot_period: 0
plot_nrow: 4
plot_ncol: 2
plot_num_predict: null
device: cuda
distributed: false
seed: 0
debug: false
fino3d:
  enabled: true
  weight: 0.03
  gamma_max: 0.7
  hidden: 256
  age: 3.0
  sex: 0
  group: 0
  field_strength: 0.0
  manufacturer: 0.0
  nuisance_mode: predict
  brain_volume: 0.0
  group_min_count: 300
  exclude_collections:
  - PT030_OpenNeuro/ds001510
  - PT030_OpenNeuro/ds001554
  - PT030_OpenNeuro/ds003974
  group_classes: null
  age_mean: null
  age_std: null
  bv_mean: null
  bv_std: null
natinit:
  enabled: true
  path: pretrained/facebook_vit-mae-base  # hf download facebook/vit-mae-base model.safetensors config.json --local-dir <this path>
  embed: true
  block_lr_mult: 1.0
  layer_decay: 1.0
  pos_scale: 1.0
  wd_to_init: true
wandb: false
wandb_entity: null
wandb_project: nanobrain-climb
subject_temper: 0.5
subject_cap: 4
subject_cap_soft: true
native_compile_mode: reduce-overhead
native_batched_corrupt: true
native_batched_level: true
native_prep_tokens: true
native_worker_clip: true
native_batched_prep: true
native_lazy_patchify: true
native_corrupt_compact: true
native_flat_loss: true
native_log_stats_only: true
native_batched_unified: true
native_sparse_tokens: true
native_bf16_residual: true
native_compiled_loss: true
native_fast_prep: true
native_fused_heads: true
native_lt_gelu: true
native_muon_combo: true
